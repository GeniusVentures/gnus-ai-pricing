name: Live GNUS supply check
on:
  pull_request:
    paths:
      - 'scripts/gnus_supply.py'
      - '.github/workflows/gnus-supply.yml'
  workflow_dispatch:

jobs:
  supply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Query four public mainnet RPCs
        run: python3 scripts/gnus_supply.py
